name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:runner-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [ianet-x64-linux]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Install Clang 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # Explicitly install LLVM's standard library
          sudo apt-get install -y libc++-22-dev libc++abi-22-dev
          sudo ln -sf /usr/bin/clang-22   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++
          clang --version
          clang++ --version

      - name: Configure
        env:
          CXXFLAGS: "-stdlib=libc++"
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.target }} --output-on-failure
